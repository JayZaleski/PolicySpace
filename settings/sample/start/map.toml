# The map: the hex tiles of the starting state. Every [[hex]] needs two whole numbers,
# `q` and `r`, its axial coordinates, and a `currency`: the name of a good from rules/,
# the good that prices on that hex are posted in. Different hexes may name different
# goods; this map uses `silver` everywhere. Nothing else is allowed yet (terrain and other
# attributes come later).
#
# The engine fixes the orientation; the setting doesn't choose it. Hexes are pointy-top.
# Each value of `r` is a straight east-west row; `q` increases eastward and `r` increases
# southward. So (1, -1) is the east neighbor of (0, -1), and the row `r = 0` is south of
# the row `r = -1`.
#
# There are no shape rules: any set of distinct coordinates is a map (holes, islands and
# negative coordinates are all fine), and a setting may have no hexes at all. Two hexes
# may not share coordinates.
#
# This map is a hexagon of radius 2 around (0, 0): 19 hexes, listed row by row from north
# to south, and west to east within each row.

# Row r = -2
[[hex]]
q = 0
r = -2
currency = "silver"

