# Deposits: units of a resource type on the map. Every [[deposit]] needs:
#
#   resource  The name of a resource type (see rules/resources.toml).
#   q, r      The axial coordinates of a hex that exists in the map.
#   count     Optional: a whole number from 1 to 1000000 (default 1). The entry places
#             that many identical deposits on the hex.
#
# Each deposit is a separate unit: it has its own ID now, and will have its own single
# owner later. A hex may hold deposits of several types. Use one entry per resource type
# per hex: two entries with the same resource and coordinates are an error.

# Three units of arable land at the center.
[[deposit]]
resource = "arable_land"
q = 0
r = 0
count = 3

# One copper deposit at the center, too.
[[deposit]]
resource = "copper_ore"
q = 0
r = 0

# Two units of arable land just west of the center.
[[deposit]]
resource = "arable_land"
q = -1
r = 0
count = 2

# One unit of arable land just east of the center.
[[deposit]]
resource = "arable_land"
q = 1
r = 0

# Two copper deposits to the north-east.
[[deposit]]
resource = "copper_ore"
q = 1
r = -1
count = 2

# One copper deposit to the south-west.
[[deposit]]
resource = "copper_ore"
q = -2
r = 1
